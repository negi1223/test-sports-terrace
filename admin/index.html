<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>カレンダー管理 | 徳島スポーツテラス</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Yomogi&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="icon" href="../images/logo.jpg">
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <span class="logo">
      <span class="logo-mark logo-mark--image"><img src="../images/logo.jpg" alt=""></span>
      <span class="logo-text">
        <span class="logo-jp">徳島スポーツテラス</span>
        <span class="logo-en">カレンダー管理</span>
      </span>
    </span>
    <button type="button" class="btn btn-ghost nav-cta" id="logoutBtn" hidden>ログアウト</button>
  </div>
</header>

<main>
  <!-- ログイン -->
  <section class="section" id="loginView">
    <div class="section-inner section-inner--narrow">
      <div class="section-title"><span class="section-title-en">Login</span><span class="section-title-jp">PINを入力してください</span></div>
      <form class="site-form" id="loginForm">
        <label><span class="lbl">PIN</span>
          <input type="password" id="pinInput" autocomplete="current-password" inputmode="numeric" required>
        </label>
        <button type="submit" class="btn btn-cta">入る</button>
        <p class="form-status" role="status" id="loginStatus" hidden></p>
        <p class="form-privacy" id="mockNote" hidden>※練習モードです（PINは 1234）。実際のシートには、書き込みません。</p>
      </form>
    </div>
  </section>

  <!-- 管理画面 -->
  <section class="section" id="appView" hidden>
    <div class="section-inner">
      <p class="form-status" role="status" id="toast" hidden></p>

      <p class="admin-bar"><button type="button" class="btn btn-ghost btn-sm" id="multiBtn">複数の日にまとめて追加</button></p>

      <div class="cal-card">
        <div class="cal-toolbar">
          <button class="cal-nav-btn" id="calPrev" aria-label="前の月">‹</button>
          <span class="cal-month-label" id="calMonthLabel"></span>
          <button class="cal-nav-btn" id="calNext" aria-label="次の月">›</button>
          <button class="cal-today-btn" id="calToday">今月へ</button>
        </div>
        <div class="cal-weekdays">
          <span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span><span>日</span>
        </div>
        <div class="cal-grid" id="calGrid"></div>
        <div class="cal-legend" id="calLegend"></div>
      </div>

      <div class="admin-day" id="dayPanel"></div>
    </div>
  </section>
</main>

<script src="config.js"></script>
<script src="admin.js"></script>
</body>
</html>
